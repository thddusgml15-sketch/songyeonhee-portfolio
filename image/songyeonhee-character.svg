    <g id="wind-up-car" transform="translate(30 330)">
      <g id="key">
        <rect x="62" y="-8" width="8" height="16" fill="#cfcfcf"/>
        <ellipse cx="54" cy="-16" rx="12" ry="8" fill="#ffd400"/>
        <ellipse cx="78" cy="-16" rx="12" ry="8" fill="#ffd400"/>
