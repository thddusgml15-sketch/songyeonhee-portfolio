      <circle cx="34" cy="62" r="5" fill="#fff" stroke="none"/>
      <circle cx="100" cy="62" r="14" fill="#1a1a1a"/>
      <circle cx="100" cy="62" r="5" fill="#fff" stroke="none"/>
    </g>
  </g>
</svg>
