    <circle id="pupil-right" cx="184" cy="155" r="6.5" fill="#1a1a1a" stroke="none"/>
    <!-- 볼터치 -->
    <ellipse cx="122" cy="182" rx="10" ry="6" fill="#ff9db0" stroke="none" opacity=".75"/>
    <ellipse cx="198" cy="182" rx="10" ry="6" fill="#ff9db0" stroke="none" opacity=".75"/>
    <!-- 코·입 -->
    <path fill="none" stroke-width="3.5" d="M160 162 q -4 10 3 12"/>
    <path fill="#ff6f8a" stroke-width="4" d="M146 188 Q 160 204 174 188 Q 160 195 146 188 Z"/>
    </g>
    <!-- 브이 손 -->
    <g id="v-hand">
      <path fill="#ffe1cf" d="M234 340 L 254 276 L 280 284 L 262 348 Z"/>
